<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🖐️🐟️</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    min-height: 100vh;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Microsoft YaHei', sans-serif;
  }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 4rem;
    color: #fff;
    letter-spacing: 8px;
    font-weight: 300;
  }
  ul {
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    list-style: none;
    align-items: center;
  }
  a {
    display: block;
    width: 260px;
    padding: 1rem;
    text-align: center;
    font-size: 1.1rem;
    text-decoration: none;
    color: rgba(255,255,255,0.7);
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    transition: all 0.3s ease;
    letter-spacing: 4px;
  }
  a:hover {
    color: #fff;
    border-color: rgba(255,255,255,0.4);
  }
  @media (max-width: 480px) {
    h1 {
      font-size: 1.8rem;
      margin-bottom: 2rem;
    }
    a {
      width: 80vw;
      max-width: 260px;
      font-size: 1rem;
    }
  }
</style>
</head>
